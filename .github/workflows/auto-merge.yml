name: Reviewed Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [Terraform CI, CodeQL, Dependency Review, Auto Approve PRs]
    types: [completed]
  status:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: metadata-reviewed-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    # This reusable job reads GitHub metadata only and never executes PR source.
    # Direct PR events only support the author allowed by pr-author below.
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
      github.event.pull_request.user.login == '4alvit'
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@e71559f44e41f39ad0037bf13c7f43bbbb2ec9af
    with:
      pr-author: 4alvit
      merge-method: squash
      reviewed-merge: true
      reviewed-single-pass: true
      required-status-checks: Terraform validation,CodeQL
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
