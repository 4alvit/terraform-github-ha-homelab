name: Reviewed Auto Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted, edited, dismissed]
  workflow_run:
    workflows: [Terraform CI, CodeQL, Dependency Review, Auto Approve PRs]
    types: [completed]
  status:
  check_run:
    types: [completed]
  check_suite:
    types: [completed]
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read
  actions: read

concurrency:
  group: metadata-reviewed-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    # This reusable job reads GitHub metadata only and never executes PR source.
    # Direct PR events are restricted to trusted same-repository authors.
    if: >-
      (github.event_name != 'pull_request' && github.event_name != 'pull_request_review') ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
       contains(fromJSON('["4alvit","californiantiramisu","renovate[bot]"]'), github.event.pull_request.user.login))
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-merge.yml@65c3a644c440fcd5f95d94b6c2fa2be1df58249c # main
    with:
      pr-author: 4alvit,californiantiramisu,renovate[bot]
      merge-method: squash
      reviewed-merge: true
      reviewed-single-pass: true
      allow-owned-bot-actions-review: true
      required-status-checks: Terraform validation,CodeQL
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
