name: Auto Approve PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: metadata-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(fromJSON('["4alvit","californiantiramisu"]'), github.event.pull_request.user.login) &&
      contains(github.event.pull_request.labels.*.name, 'auto-approve') &&
      !github.event.pull_request.draft
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@8008fd1db4c410640e7abddfc8bc75833cdcd970
    with:
      authors: '["4alvit","californiantiramisu"]'
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
