name: Auto Approve PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: metadata-approval-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      ((github.event.pull_request.user.login == '4alvit' && contains(github.event.pull_request.labels.*.name, 'auto-approve')) ||
       contains(fromJSON('["californiantiramisu","renovate[bot]"]'), github.event.pull_request.user.login)) &&
      !github.event.pull_request.draft
    uses: victron-venus/venus-os-ci-toolkit/.github/workflows/auto-approve-reusable.yml@4c0b1565d4437315d1a8aadb4b2ab3e3fa350526 # main
    with:
      authors: '["4alvit","californiantiramisu","renovate[bot]"]'
    secrets:
      BOT_PAT: ${{ secrets.BOT_PAT }}
      APPROVAL_PAT: ${{ secrets.APPROVAL_PAT }}
