version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    # CodeQL initialization, analysis and SARIF upload share one release.
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
    schedule:
      interval: weekly
  - package-ecosystem: terraform
    directory: /
    schedule:
      interval: weekly

# security/provider is a dependency snapshot, not a standalone module.
# Regenerate and qualify it with scripts/build_secure_provider.py; standalone
# Go-module updates can delete upstream requirements and checksums.
